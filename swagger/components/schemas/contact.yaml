type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: 'Unique identifier generated by MongoDB.'
    type: string
    example: 65ca67e7ae7f10c88b598384
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: 'john.doe@example.com'
  phoneNumber:
    description: "Contact's phone"
    type: string
    example: '+38000000059'
  isFavourite:
    description: 'Marks if the contact is a favorite (Optional, default: false).'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: "Optional URL to the contact's profile picture."
    type: string
    format: url
    example: 'https://res.cloudinary.com/djvxoecqe/image/upload/v1761371495/img.jpg'
  userId:
    description: "Contact's id"
    type: string
    example: 65ca67e7ae7f10c88b598384
  createdAt:
    type: string
    format: date-time
    example: '2023-10-10T14:48:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2023-10-10T14:48:00.000Z'
