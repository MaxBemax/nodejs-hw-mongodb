type: object
properties:
  name:
    type: string
    description: Updated name of the contact.
    example: 'Glen Miller'
  phoneNumber:
    type: string
    description: Updated phone number.
    example: '+380991234567'
  email:
    type: string
    format: email
    description: Updated email address.
    example: 'glen@example.com'
  isFavourite:
    type: boolean
    description: Flag to mark the contact as a favorite.
    example: true
  contactType:
    type: string
    description: Type of contact.
    enum: [work, home, personal]
    example: 'personal'
