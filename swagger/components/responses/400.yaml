description: Bad Request
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data # <-- Залишаємо data для деталей валідації
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request Error
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: 'ValidationError: "name" is required'
