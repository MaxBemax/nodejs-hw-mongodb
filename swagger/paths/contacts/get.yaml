tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: 'Get list of users with this endpoint'
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination. Default is 1.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: perPage
    in: query
    description: Number of items per page. Default is 10.
    schema:
      type: integer
      minimum: 1
      default: 10
  - name: sortOrder
    in: query
    description: Sort order for the list. Default is ASC.
    schema:
      type: string
      enum: ['asc', 'desc']
      default: 'asc'
  - name: sortBy
    in: query
    description: Field to sort the contacts by 'name'.
    schema:
      type: string
      enum: ['name']
      default: 'name'
  - name: isFavourite
    in: query
    description: Filter by favorite status. True for favorites, false for non-favorites.
    schema:
      type: boolean
  - name: contactType
    in: query
    description: Filter by contact type.
    schema:
      type: string
      enum: ['work', 'home', 'personal']
responses:
  '200':
    description: List of contacts got successfully with pagination data.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - totalPages
                - totalItems
                - page
                - perPage
                - hasNextPage
                - hasPrevPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                totalPages:
                  type: integer
                  example: 5
                totalItems:
                  type: integer
                  example: 48
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                hasNextPage:
                  type: boolean
                  example: true
                hasPrevPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
